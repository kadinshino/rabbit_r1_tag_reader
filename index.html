<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#111111" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>R1 Tag Reader</title>
  <link rel="stylesheet" href="./styles.css?v=3" />
</head>
<body>
  <main class="app">
    <section class="camera-card">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div id="cameraMessage" class="camera-message">Starting camera…</div>
    </section>

    <section class="controls">
      <select id="mode">
        <option value="auto">AUTO</option>
        <option value="qr">QR</option>
        <option value="apriltag">APRILTAG</option>
      </select>

      <select id="family">
        <option value="tag36h11">tag36h11</option>
      </select>
    </section>

    <section class="result-card">
      <div id="resultType" class="result-type">—</div>
      <div id="resultValue" class="result-value">Nothing scanned</div>
      <div id="resultMeta" class="result-meta">Ready</div>
    </section>

    <section class="actions">
      <button id="startBtn">STOP</button>
      <button id="copyBtn" class="secondary">COPY</button>
    </section>
  </main>

  <canvas id="workCanvas" hidden></canvas>
  <script type="module" src="./js/app.js?v=3"></script>
</body>
</html>
