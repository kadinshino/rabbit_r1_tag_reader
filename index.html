<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#111111" />
  <title>R1 Tag Reader</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">R1 TOOL</div>
        <h1>Tag Reader</h1>
      </div>
      <div id="statusDot" class="status-dot" title="status"></div>
    </header>

    <section class="camera-card">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="cameraMessage" class="camera-message">Press START</div>
    </section>

    <section class="controls">
      <select id="mode">
        <option value="auto">AUTO</option>
        <option value="qr">QR</option>
        <option value="apriltag">APRILTAG</option>
      </select>

      <select id="family">
        <option value="tag36h11">tag36h11</option>
        <option value="tagStandard41h12">tagStandard41h12</option>
        <option value="tagStandard52h13">tagStandard52h13</option>
        <option value="tag25h9">tag25h9</option>
        <option value="tag16h5">tag16h5</option>
        <option value="tagCircle21h7">tagCircle21h7</option>
        <option value="tagCircle49h12">tagCircle49h12</option>
      </select>
    </section>

    <section class="result-card">
      <div class="label">LAST DETECTION</div>
      <div id="resultType" class="result-type">—</div>
      <div id="resultValue" class="result-value">Nothing scanned</div>
      <div id="resultMeta" class="result-meta">Ready</div>
    </section>

    <section class="actions">
      <button id="startBtn">START</button>
      <button id="copyBtn" class="secondary">COPY</button>
    </section>

    <footer id="footerStatus">QR ready • AprilTag module optional</footer>
  </main>

  <canvas id="workCanvas" hidden></canvas>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
